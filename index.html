<!DOCTYPE html>

  <title>教育与心智 · 知识图谱</title>

  <meta name="color-scheme" content="light dark" />

  <script>
    // 首屏即确定主题，避免闪烁；用户显式选择优先，其次跟随系统
    (function () {
      var stored = null;
      try { stored = localStorage.getItem("atlas-theme"); } catch (e) {}
      var t = stored === "dark" || stored === "light"
        ? stored
        : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>

  <!-- 字体：非阻塞加载；即便字体不可达，也使用系统字体正常渲染 -->

  <script>
    // 数据规范化：合并同一配对 + 同一类型的重复关联（保留首次出现）
    (function () {
      var seen = {}, out = [];
      (window.ATLAS.links || []).forEach(function (l) {
        var k = [l[0], l[1]].sort().join("|") + "|" + l[2];
        if (!seen[k]) { seen[k] = 1; out.push(l); }
      });
      window.ATLAS.links = out;
    })();
  </script>
